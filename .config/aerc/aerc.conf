# Main aerc configuration. Account details are generated by setup/aerc.sh.

[ui]
# NeoMutt used reverse-date; aerc displays newest messages first by default.
timestamp-format=01/02 03:04 PM
this-day-time-format=03:04 PM
sidebar-width=22

[viewer]
# Prefer plain text, falling back to aerc's built-in HTML renderer.
alternatives=text/plain,text/html

[compose]
editor=nvim

[hooks]
# Refresh Radicale contacts in the background when aerc starts.
aerc-startup="$HOME/Library/Preferences/aerc/bin/refresh-address-book"
